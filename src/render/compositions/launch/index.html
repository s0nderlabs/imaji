<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>imaji launch</title>
<link rel="stylesheet" href="../../vendor/fonts/vendored.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:#1A1614}

.stage{
  --ground:#1A1614;
  --ink:#F3EFE8;
  --ink-2:#A69E94;
  --line:rgba(243,239,232,0.15);
  --accent:#E2583E;
  --accent-ink:#1A1614;
  --shadow-contact:rgba(0,0,0,0.34);
  --shadow-ambient:rgba(0,0,0,0.46);
  --font-display:'Adventor','Open Sauce One',"Helvetica Neue",Helvetica,sans-serif;
  --font-text:'Open Sauce One',"Helvetica Neue",Helvetica,sans-serif;
  --font-mono:'Geist Pixel',ui-monospace,monospace;

  position:relative;
  width:1920px;height:1080px;
  overflow:hidden;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-text);
  -webkit-font-smoothing:antialiased;
}
.stage[data-ground="light"]{
  --ground:#F7F4EE;
  --ink:#1C1714;
  --ink-2:#756D63;
  --line:rgba(28,23,20,0.14);
  --accent-ink:#F7F4EE;
  --shadow-contact:rgba(28,23,20,0.16);
  --shadow-ambient:rgba(28,23,20,0.20);
}
.stage[data-type="serif"]{
  --font-display:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-text:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
.stage[data-type="mono"]{
  --font-display:ui-monospace,"SF Mono",Menlo,monospace;
  --font-text:ui-monospace,"SF Mono",Menlo,monospace;
}

/* every beat is one absolutely positioned scene inside the 96px safe area.
   Two are painted only during a 0.4 s cross-fade; the rest of the time
   exactly one is, which keeps each rendered frame cheap. */
.scene{
  position:absolute;
  left:96px;right:96px;top:96px;bottom:96px;
  display:flex;
  opacity:0;
}
.scene-open{flex-direction:column;align-items:center;justify-content:center}
.scene-text{flex-direction:column;align-items:flex-start;justify-content:center}
.scene-lines{flex-direction:column;align-items:flex-start;justify-content:center;gap:38px}
.scene-close{flex-direction:column;align-items:center;justify-content:center}
.scene-shot{flex-direction:column;align-items:center;justify-content:center}

.mark{
  font-family:var(--font-display);
  font-weight:700;
  letter-spacing:-0.02em;
  line-height:1;
  color:var(--ink);
  white-space:nowrap;
}
.mark .ch{display:inline-block}
.mark img{display:block;width:auto}
.mark-lg{font-size:154px}
.mark-lg img{height:300px;max-width:1300px}
.mark-sm{font-size:84px}
.mark-sm img{height:140px;max-width:900px}

.rule{height:2px;background:var(--ink-2);opacity:0.55;border-radius:1px;width:0}
.rule-open{margin-top:38px}
.rule-close{margin-top:40px}

/* the version is a quiet pixel tag; the accent belongs to the headline word */
.version{
  font-family:var(--font-mono);
  font-size:34px;line-height:1;
  color:var(--ink-2);
  white-space:nowrap;
}
.version-open{margin-top:44px}

.meta-row{display:flex;align-items:center;gap:28px;margin-top:40px}
.url{
  font-family:var(--font-text);
  font-size:30px;line-height:1;
  color:var(--ink-2);
  white-space:nowrap;
}

.headline{
  font-family:var(--font-display);
  font-weight:700;
  font-size:150px;
  line-height:1.02;
  letter-spacing:-0.024em;
  color:var(--ink);
  margin:0;
  width:100%;
  position:relative;
  z-index:0;
  /* let a very long single token break rather than run off the stage */
  overflow-wrap:anywhere;
  word-break:break-word;
}
.headline .w{display:inline-block;overflow-wrap:anywhere}
.headline .ch{display:inline-block;opacity:0}
.headline .ch.is-on{opacity:1}
.acc{position:relative;display:inline-block}
/* Adventor puts its descender ink 1.073em below the top of a 1.02em line box,
   so a block that stops at the box floor cuts the tail off a "g". The insets
   are the same on both sides (the word's own width defines the block, never
   the space beside it) and the bottom is let out far enough that a descender
   sits inside. z-index keeps it behind every glyph in the headline, so the
   small bleed past the line box can never paint over a neighbouring line. */
.acc .acc-block{
  position:absolute;
  left:-0.14em;right:-0.14em;top:0.02em;bottom:-0.14em;
  z-index:-1;
  background:var(--accent);
  border-radius:0.07em;
  transform:scaleX(0);
  transform-origin:0% 50%;
}
.acc .acc-chars{position:relative}

.sub{
  margin:38px 0 0;
  font-size:46px;line-height:1.32;
  font-weight:400;
  letter-spacing:-0.008em;
  color:var(--ink-2);
  max-width:1400px;
}

.line{
  display:flex;align-items:baseline;gap:30px;
  font-size:62px;line-height:1.18;
  font-weight:400;
  letter-spacing:-0.012em;
  color:var(--ink);
  width:100%;
}
.line .dash{
  flex:0 0 auto;
  width:34px;height:2px;
  background:var(--ink-2);
  border-radius:1px;
  transform:translateY(-0.36em);
}
.line .txt{flex:1 1 auto}

.closing{
  font-family:var(--font-display);
  font-size:84px;line-height:1.1;
  font-weight:700;
  letter-spacing:-0.012em;
  color:var(--ink);
  text-align:center;
  margin:44px 0 0;
  max-width:1500px;
}
.closing .w{display:inline-block}

/* the picture beats. The frame is the image itself: rounded, a hairline by
   tone rather than a border, one contact shadow and one ambient shadow. */
.shotwrap{display:flex;align-items:center;justify-content:center}
.shot{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  background:var(--ground);
  box-shadow:
    0 2px 4px var(--shadow-contact),
    0 34px 68px -24px var(--shadow-ambient),
    inset 0 0 0 1px var(--line);
}
.shot img{display:block}
.shot-still img{max-width:1500px;max-height:768px;width:auto;height:auto}
/* the capture beat shows the fold and nothing else. At 1560px the page is
   drawn at 81% of the size it was shot at, which is where its body text
   becomes readable in a 1920 frame; the frame is shorter than the shot, so
   the bottom of the fold is cropped rather than shrunk into illegibility. */
.shot-cap{width:1560px;height:780px}
.shot-cap img{position:absolute;left:0;top:0;width:100%;height:auto}

/* the still drifts to scale 1.04 across its beat, so the gap has to survive
   the frame growing about 15px downward into it */
.caption{
  margin:46px 0 0;
  font-size:34px;line-height:1.3;
  font-weight:400;
  letter-spacing:-0.004em;
  color:var(--ink-2);
  text-align:center;
  max-width:1400px;
}
</style>
</head>
<body>
<div class="stage" data-composition-id="imaji-launch" data-width="1920" data-height="1080"></div>
<script src="../../vendor/gsap.min.js"></script>
<script>/*__IMAJI_VARS__*/</script>
<script>
(function () {
  var V = window.IMAJI_VARS || {}
  var stage = document.querySelector("[data-composition-id]")

  stage.setAttribute("data-ground", V.ground === "light" ? "light" : "dark")
  stage.setAttribute("data-type", V.type || "grotesque")
  if (V.accent) stage.style.setProperty("--accent", V.accent)

  /* look: type scale and motion tempo only. The beat slots are fixed by the
     storyboard, so tempo changes how fast a beat resolves inside its own
     slot, never where the slots sit. */
  var LOOK = V.look === "punchy" ? { scale: 1.06, tempo: 1.3 }
           : V.look === "quiet"  ? { scale: 0.94, tempo: 0.8 }
           : { scale: 1, tempo: 1 }
  var T = LOOK.tempo
  var d = function (seconds) { return seconds / T }

  /* the same numbers as src/lib/kit.ts. If these two drift the mp4 is cut
     short, so they are written out here rather than derived. */
  var DUR = { mark: 2.5, text: 4, image: 4.5, capture: 5, linesBase: 1.8, linePer: 1.2, signoff: 3.5 }
  /* a beat fades OUT to the ground over its last CROSS seconds and the next
     one fades IN from the ground after it. Nothing is ever readable on top of
     anything else, which is what made a display headline over a screenshot
     look muddy. */
  var CROSS = 0.3
  /* the leaving beat is given a slightly longer tail than the gap it starts
     in, so at the boundary itself it is still faintly on: without the tail
     both beats sit at zero for exactly one frame and the video blinks black
     between beats. Nothing may ever produce an empty frame. */
  var CROSS_TAIL = 0.05

  var accentInk = getComputedStyle(stage).getPropertyValue("--accent-ink").trim() || "#1A1614"
  var inkColor = getComputedStyle(stage).getPropertyValue("--ink").trim() || "#F3EFE8"
  var ink2Color = getComputedStyle(stage).getPropertyValue("--ink-2").trim() || "#A69E94"

  var beats = (V.launch && V.launch.beats) || []
  var version = V.version || ""
  var url = (V.url || "").replace(/^https?:\/\//, "").replace(/\/$/, "")

  /* ---------- content ---------- */

  function el(tag, cls, parent) {
    var node = document.createElement(tag)
    if (cls) node.className = cls
    if (parent) parent.appendChild(node)
    return node
  }

  function spanChars(node, text) {
    node.innerHTML = ""
    var spans = []
    var chars = String(text).split("")
    for (var i = 0; i < chars.length; i++) {
      var s = el("span", "ch", node)
      s.textContent = chars[i] === " " ? " " : chars[i]
      spans.push(s)
    }
    return spans
  }

  function buildMark(node, useChars) {
    if (V.logoDataUrl) {
      var img = document.createElement("img")
      img.src = V.logoDataUrl
      img.alt = ""
      node.appendChild(img)
      return { logo: true, parts: [img] }
    }
    var text = V.brandName || ""
    if (!useChars) { node.textContent = text; return { logo: false, parts: [node] } }
    return { logo: false, parts: spanChars(node, text) }
  }

  /* a headline split into words then characters, with the accent word wrapped
     in a block that wipes in behind it. Chars keep their space at all times
     (opacity, never display) so nothing reflows while the line types on. */
  function buildHeadline(node, text, accentWord) {
    var out = { chars: [], accChars: [], accBlock: null }
    var want = (accentWord || "").toLowerCase()
    var parts = String(text || "").split(/(\s+)/)
    var used = false
    node.innerHTML = ""
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i]
      if (!part) continue
      if (/^\s+$/.test(part)) {
        /* a real text node, not an inline-block span: collapsible whitespace
           is dropped at a line break, so a wrapped line never opens with a
           leading space the way a white-space:pre span made it */
        node.appendChild(document.createTextNode(" "))
        continue
      }
      var bare = part.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "").toLowerCase()
      var word = el("span", "w", node)
      if (!used && want && bare === want) {
        used = true
        var wrap = el("span", "acc", word)
        out.accBlock = el("span", "acc-block", wrap)
        var inner = el("span", "acc-chars", wrap)
        out.accChars = spanChars(inner, part)
        out.chars = out.chars.concat(out.accChars)
      } else {
        out.chars = out.chars.concat(spanChars(word, part))
      }
    }
    return out
  }

  function buildClosing(node, text) {
    var words = String(text || "").split(/\s+/).filter(Boolean)
    var out = []
    node.innerHTML = ""
    for (var i = 0; i < words.length; i++) {
      var w = el("span", "w", node)
      w.textContent = words[i]
      out.push(w)
      if (i < words.length - 1) node.appendChild(document.createTextNode(" "))
    }
    return out
  }

  /* ---------- scenes ---------- */

  var scenes = []

  function openScene() {
    var scene = el("div", "scene scene-open", stage)
    var mark = buildMark(el("div", "mark mark-lg", scene), true)
    var rule = el("div", "rule rule-open", scene)
    var tag = el("div", "version version-open", scene)
    tag.textContent = version
    if (!version) tag.style.display = "none"
    return { kind: "mark", dur: DUR.mark, node: scene, mark: mark, rule: rule, tag: tag }
  }

  function textScene(beat) {
    var scene = el("div", "scene scene-text", stage)
    var h = el("h1", "headline", scene)
    var built = buildHeadline(h, beat.headline, beat.accentWord)
    var sub = null
    if (beat.sub) { sub = el("p", "sub", scene); sub.textContent = beat.sub }
    return { kind: "text", dur: DUR.text, node: scene, h: h, built: built, sub: sub }
  }

  function stillScene(beat) {
    var scene = el("div", "scene scene-shot", stage)
    var wrap = el("div", "shotwrap", scene)
    var shot = el("div", "shot shot-still", wrap)
    var img = document.createElement("img")
    img.src = beat.src
    img.alt = ""
    shot.appendChild(img)
    var cap = null
    if (beat.caption) { cap = el("p", "caption", scene); cap.textContent = beat.caption }
    return { kind: "image", dur: DUR.image, node: scene, shot: shot, cap: cap }
  }

  /* One picture, one element, one move. The beat used to hold the fold and
     the whole page on top of each other and dissolve between them, which read
     as a ghosted double exposure, and the full-page shot was drawn at page
     scale where body text is about four pixels tall. Now it is the fold
     alone, drawn big enough to read, and the only motion is a slow push in. */
  function panScene(beat) {
    var scene = el("div", "scene scene-shot", stage)
    var wrap = el("div", "shotwrap", scene)
    var shot = el("div", "shot shot-cap", wrap)
    var fold = document.createElement("img")
    fold.src = beat.fold
    fold.alt = ""
    shot.appendChild(fold)
    var cap = null
    if (beat.caption) { cap = el("p", "caption", scene); cap.textContent = beat.caption }
    return { kind: "capture", dur: DUR.capture, node: scene, shot: shot, fold: fold, cap: cap }
  }

  function linesScene(beat) {
    var scene = el("div", "scene scene-lines", stage)
    var rows = []
    for (var i = 0; i < beat.lines.length; i++) {
      var row = el("div", "line", scene)
      el("span", "dash", row)
      var txt = el("span", "txt", row)
      txt.textContent = beat.lines[i]
      rows.push(row)
    }
    return { kind: "lines", dur: DUR.linesBase + DUR.linePer * rows.length, node: scene, rows: rows }
  }

  function signoffScene(beat) {
    var scene = el("div", "scene scene-close", stage)
    var mark = buildMark(el("div", "mark mark-sm", scene), false)
    var closing = el("p", "closing", scene)
    var words = buildClosing(closing, beat.closing)
    var rule = el("div", "rule rule-close", scene)
    /* the closing line is the Mind's own sentence and it often already
       carries the version or the url. Whatever it already says, the meta row
       does not repeat: it shows only the piece that is missing, and
       disappears when the sentence covers both. */
    var said = String(beat.closing || "").toLowerCase()
    var showVersion = !!version && said.indexOf(String(version).toLowerCase()) === -1
    var showUrl = !!url && said.indexOf(url.toLowerCase()) === -1
    var meta = el("div", "meta-row", scene)
    var tag = el("span", "version", meta)
    tag.textContent = showVersion ? version : ""
    if (!showVersion) tag.style.display = "none"
    var link = el("span", "url", meta)
    link.textContent = showUrl ? url : ""
    if (!showUrl) link.style.display = "none"
    if (!showVersion && !showUrl) meta.style.display = "none"
    return { kind: "signoff", dur: DUR.signoff, node: scene, mark: mark, closing: closing, words: words, rule: rule, meta: meta, showMeta: showVersion || showUrl }
  }

  scenes.push(openScene())
  for (var b = 0; b < beats.length; b++) {
    var beat = beats[b] || {}
    if (beat.type === "text") scenes.push(textScene(beat))
    else if (beat.type === "image") scenes.push(stillScene(beat))
    else if (beat.type === "capture") scenes.push(panScene(beat))
    else if (beat.type === "lines" && beat.lines && beat.lines.length) scenes.push(linesScene(beat))
    else if (beat.type === "signoff") scenes.push(signoffScene(beat))
  }

  /* ---------- fit: nothing may overflow the stage ---------- */

  function fitBlock(node, basePx, sceneNode, ladder) {
    for (var k = 0; k < ladder.length; k++) {
      node.style.fontSize = (basePx * ladder[k]).toFixed(2) + "px"
      if (node.scrollWidth <= node.clientWidth + 1 && sceneNode.scrollHeight <= sceneNode.clientHeight) return
    }
  }

  /* An image beat is usually a screenshot, which fills the frame on its own.
     A logo or a small diagram would sit lost in the middle of a 1920 stage,
     so it is scaled up to the same box, and never past twice its own size,
     because past that a raster turns to mush. The one thing that outranks
     that ceiling is the floor: no picture is drawn narrower than 40% of the
     stage unless the height cap is what stops it. */
  var STILL_MAX_W = 1500, STILL_MAX_H = 768, STILL_MIN_W = 768
  function sizeStills() {
    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i]
      if (s.kind !== "image") continue
      var img = s.shot.querySelector("img")
      var nw = img.naturalWidth || 0
      var nh = img.naturalHeight || 0
      if (!nw || !nh) continue
      var k = Math.min(Math.min(STILL_MAX_W / nw, STILL_MAX_H / nh), 2)
      var floor = Math.min(STILL_MIN_W / nw, STILL_MAX_H / nh)
      if (k < floor) k = floor
      img.style.width = Math.round(nw * k) + "px"
      img.style.height = Math.round(nh * k) + "px"
    }
  }

  function fitAll() {
    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i]
      if (s.kind === "mark") {
        var markEl = s.node.querySelector(".mark")
        var markLadder = [1, 0.8, 0.64]
        for (var m = 0; m < markLadder.length; m++) {
          markEl.style.fontSize = (154 * LOOK.scale * markLadder[m]).toFixed(2) + "px"
          if (markEl.scrollWidth <= s.node.clientWidth) break
        }
      } else if (s.kind === "text") {
        fitBlock(s.h, 150 * LOOK.scale, s.node, [1, 0.84, 0.7, 0.58])
        if (s.sub) fitBlock(s.sub, 46 * LOOK.scale, s.node, [1, 0.88, 0.76, 0.66])
      } else if (s.kind === "lines") {
        var lineBase = 62 * LOOK.scale
        var lineLadder = [1, 0.84, 0.7]
        for (var k = 0; k < lineLadder.length; k++) {
          for (var r = 0; r < s.rows.length; r++) s.rows[r].style.fontSize = (lineBase * lineLadder[k]).toFixed(2) + "px"
          if (s.node.scrollHeight <= s.node.clientHeight) break
        }
      } else if (s.kind === "signoff") {
        fitBlock(s.closing, 84 * LOOK.scale, s.node, [1, 0.84, 0.7, 0.58])
      }
      if (s.cap) fitBlock(s.cap, 34 * LOOK.scale, s.node, [1, 0.88, 0.78])
    }
  }

  /* ---------- the one timeline ---------- */

  function revealer(chars) {
    return function (count) {
      var k = Math.max(0, Math.min(chars.length, Math.floor(count)))
      for (var i = 0; i < chars.length; i++) {
        if (i < k) chars[i].classList.add("is-on")
        else chars[i].classList.remove("is-on")
      }
    }
  }

  function build() {
    sizeStills()
    fitAll()

    var tl = gsap.timeline({ paused: true })
    var at = 0

    /* a slot with a hold to protect is timed with ds(): the shorter of the
       designed duration and the look's tempo, so "quiet" can never stretch a
       beat past the end of its own slot. */
    var ds = function (seconds) { return Math.min(seconds, d(seconds)) }

    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i]
      var start = at
      var end = at + s.dur
      var last = i === scenes.length - 1

      /* rest state, all of it with gsap.set, never gsap.from */
      gsap.set(s.node, { opacity: 0, y: 0 })
      /* the first beat is already ON at t = 0: the first frame of the file is
         the autoplay thumbnail on every platform, so it can never be empty */
      if (i === 0) gsap.set(s.node, { opacity: 1 })
      else tl.to(s.node, { opacity: 1, duration: ds(CROSS), ease: "power2.out" }, start)
      /* out to the ground BEFORE the next beat comes in, never across it */
      if (!last) tl.to(s.node, { opacity: 0, duration: ds(CROSS) + CROSS_TAIL, ease: "power2.in" }, end - CROSS)

      if (s.kind === "mark") {
        var markEl = s.node.querySelector(".mark")
        gsap.set(s.mark.parts, { opacity: 1, y: 0 })
        gsap.set(markEl, { scale: 1.02, transformOrigin: "50% 50%" })
        gsap.set(s.rule, { width: 0 })
        gsap.set(s.tag, { opacity: 0, y: 22 })
        tl.to(markEl, { scale: 1, duration: ds(0.85), ease: "power3.out" }, start)
        tl.to(s.rule, { width: markEl.offsetWidth || 320, duration: ds(0.65), ease: "power3.out" }, start + 0.30)
        tl.to(s.tag, { opacity: 1, y: 0, duration: ds(0.6), ease: "power3.out" }, start + 0.60)
      }

      if (s.kind === "text") {
        var chars = s.built.chars
        var reveal = revealer(chars)
        /* the counter starts at one, not zero: a type-on that begins from
           nothing leaves the beat's opening frames blank while the scene is
           already fading in, and a blank frame is never allowed */
        reveal(1)
        if (s.built.accBlock) gsap.set(s.built.accBlock, { scaleX: 0 })
        if (s.built.accChars.length) gsap.set(s.built.accChars, { color: inkColor })
        if (s.sub) gsap.set(s.sub, { opacity: 0, y: 30 })
        var n = chars.length
        var typeDur = Math.max(0.9, Math.min(1.8, n * 0.028))
        var counter = { v: 1 }
        tl.to(counter, {
          v: n, duration: typeDur, ease: "none",
          onUpdate: (function (fn, c) { return function () { fn(c.v) } })(reveal, counter)
        }, start)
        var blockAt = start + typeDur + 0.08
        if (s.built.accBlock) {
          tl.to(s.built.accBlock, { scaleX: 1, duration: ds(0.5), ease: "expo.out" }, blockAt)
          tl.to(s.built.accChars, { color: accentInk, duration: ds(0.28), ease: "power2.out" }, blockAt + ds(0.16))
        }
        if (s.sub) tl.to(s.sub, { opacity: 1, y: 0, duration: ds(0.7), ease: "expo.out" }, blockAt + 0.24)
      }

      if (s.kind === "image") {
        /* the picture is opaque from the first frame of the beat and the
           scene's own fade carries it in; a second opacity ramp on top left
           the first tenth of a second on an empty stage */
        gsap.set(s.shot, { opacity: 1, scale: 0.96, transformOrigin: "50% 50%" })
        if (s.cap) gsap.set(s.cap, { opacity: 0, y: 24 })
        tl.to(s.shot, { scale: 1, duration: ds(0.9), ease: "expo.out" }, start)
        tl.to(s.shot, { scale: 1.04, duration: s.dur - 1.2, ease: "none" }, start + 0.9)
        if (s.cap) tl.to(s.cap, { opacity: 1, y: 0, duration: ds(0.6), ease: "power3.out" }, start + 0.7)
      }

      if (s.kind === "capture") {
        /* one element, one continuous move: a slow push from 1.00 to 1.05
           across the beat. No second image, so nothing to ghost against. */
        gsap.set(s.shot, { opacity: 1, scale: 0.96, transformOrigin: "50% 50%" })
        if (s.cap) gsap.set(s.cap, { opacity: 0, y: 24 })
        tl.to(s.shot, { scale: 1, duration: ds(0.9), ease: "expo.out" }, start)
        tl.to(s.shot, { scale: 1.05, duration: s.dur - 1.2, ease: "none" }, start + 0.9)
        if (s.cap) tl.to(s.cap, { opacity: 1, y: 0, duration: ds(0.6), ease: "power3.out" }, start + 0.7)
      }

      if (s.kind === "lines") {
        gsap.set(s.rows, { opacity: 0, y: 40, color: inkColor })
        for (var r = 0; r < s.rows.length; r++) {
          var rowAt = start + 0.05 + r * DUR.linePer
          tl.to(s.rows[r], { opacity: 1, y: 0, duration: ds(0.75), ease: "expo.out" }, rowAt)
          if (r < s.rows.length - 1) {
            tl.to(s.rows[r], { color: ink2Color, duration: ds(0.45), ease: "power2.out" }, rowAt + DUR.linePer)
          }
        }
      }

      if (s.kind === "signoff") {
        /* everything has landed one second in, so the finished frame is the
           one the viewer is left with for the last two and a half seconds */
        gsap.set(s.mark.parts, { opacity: 0, y: 24 })
        gsap.set(s.words, { opacity: 0, y: 24 })
        gsap.set(s.rule, { width: 0 })
        gsap.set(s.meta, { opacity: 0, y: 14 })
        tl.to(s.mark.parts, { opacity: 1, y: 0, duration: ds(0.4), ease: "power3.out" }, start)
        tl.to(s.words, { opacity: 1, y: 0, duration: ds(0.4), ease: "power3.out", stagger: ds(0.02) }, start + 0.1)
        tl.to(s.rule, { width: Math.max(240, Math.min(760, s.closing.offsetWidth || 480)), duration: ds(0.4), ease: "power3.out" }, start + 0.35)
        if (s.showMeta) tl.to(s.meta, { opacity: 1, y: 0, duration: ds(0.4), ease: "power3.out" }, start + 0.55)
      }

      at = end
    }

    /* hold the last frame so the file is exactly as long as kit.ts said */
    tl.to({}, { duration: 0.01 }, Math.max(0.02, at - 0.01))

    window.__timelines = window.__timelines || {}
    window.__timelines.main = tl
    window.IMAJI_READY = true
  }

  /* every picture is a data URL, so nothing here touches the network, but a
     decode is still async and the pan needs the decoded height to measure. */
  function pictures() {
    var imgs = Array.prototype.slice.call(stage.querySelectorAll("img"))
    return Promise.all(imgs.map(function (img) {
      if (img.complete && img.naturalWidth) return Promise.resolve()
      return new Promise(function (done) { img.onload = done; img.onerror = done })
    }))
  }

  var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()
  Promise.all([fonts, pictures()]).then(build)
})()
</script>
</body>
